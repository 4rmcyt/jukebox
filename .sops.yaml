keys:
  # Admin age key (age1...), from ~/.config/sops/age/keys.txt
  - &admin age1REPLACE_ADMIN
  # Host key: ssh-to-age < hosts/jukebox/ssh_host_ed25519_key.pub
  - &jukebox age1REPLACE_HOST
creation_rules:
  - path_regex: secrets/jukebox\.yaml$
    key_groups:
      - age:
          - *admin
          - *jukebox
